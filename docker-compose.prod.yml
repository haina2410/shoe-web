name: ${COMPOSE_PROJECT_NAME:-leafshoes}

# App, worker, migrate và smoke được pull từ ghcr.io — chính bản image mà
# .github/workflows/publish-images.yml đã build cho commit đó, không build lại
# trên VPS. `RELEASE_TAG` mà scripts/deploy-production.sh sinh ra là sha 12 ký
# tự, đúng tag workflow đẩy lên, nên checkout ở commit nào là chạy image commit
# đó.
#
# Không service nào ở đây có `build:`, và đó là điều cố ý: Compose spec quy định
# khi có cả `build:` lẫn `image:` mà không khai `pull_policy` thì nó pull trước,
# pull không ra thì **âm thầm build từ source**. Khi ấy một release pull lỗi sẽ
# lặng lẽ thành một bản build khác thay vì báo lỗi. Cần build tại chỗ (registry
# không tới được mà vẫn phải deploy) thì dùng override tường minh:
#
#   BUILD_LOCALLY=1 npm run deploy:production   # xem docker-compose.build.yml

x-runtime-environment: &runtime-environment
  DATABASE_URL: postgresql://${POSTGRES_USER:?required}:${POSTGRES_PASSWORD:?required}@postgres:5432/${POSTGRES_DB:?required}?schema=public
  APP_BASE_URL: ${APP_BASE_URL:?required}
  VIETQR_BANK_CODE: ${VIETQR_BANK_CODE:?required}
  VIETQR_ACCOUNT_NO: ${VIETQR_ACCOUNT_NO:?required}
  VIETQR_ACCOUNT_NAME: ${VIETQR_ACCOUNT_NAME:?required}
  VIETQR_TEMPLATE: ${VIETQR_TEMPLATE:-compact2}
  RESEND_API_KEY: ${RESEND_API_KEY:?required}
  MAIL_FROM: ${MAIL_FROM:?required}
  MAIL_REPLY_TO: ${MAIL_REPLY_TO:?required}
  MAIL_TO_OVERRIDE: ${MAIL_TO_OVERRIDE:-}

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?required}
      POSTGRES_USER: ${POSTGRES_USER:?required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?required}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql/data

  migrate:
    image: ghcr.io/haina2410/shoe-web/migrate:${RELEASE_TAG:-latest}
    # `missing`, không phải `always`: tag sha là bất biến nên bản local đã pull
    # về luôn đúng, và backup/diagnosis (`compose run`, `exec`) không phải chạm
    # tới registry mới làm việc được.
    #
    # Deploy không dựa vào policy này: nó gọi `compose pull --policy always` để
    # ép lấy bản của CI, vì `compose pull` mặc định tôn trọng `missing` và sẽ bỏ
    # qua image đã nằm sẵn ở local — kể cả bản do BUILD_LOCALLY build ra.
    pull_policy: missing
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:?required}:${POSTGRES_PASSWORD:?required}@postgres:5432/${POSTGRES_DB:?required}?schema=public
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?required}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:?required}
      SEED_OWNER_EMAIL: ${SEED_OWNER_EMAIL:-}
      SEED_OWNER_PASSWORD: ${SEED_OWNER_PASSWORD:-}
      SEED_STAFF_EMAIL: ${SEED_STAFF_EMAIL:-}
      SEED_STAFF_PASSWORD: ${SEED_STAFF_PASSWORD:-}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    profiles: ["ops"]

  app:
    image: ghcr.io/haina2410/shoe-web/app:${RELEASE_TAG:-latest}
    pull_policy: missing
    environment:
      <<: *runtime-environment
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?required}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:?required}
      SEPAY_WEBHOOK_SECRET: ${SEPAY_WEBHOOK_SECRET:?required}
      UPLOAD_DIR: ${UPLOAD_DIR:-/data/uploads}
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-5242880}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:${APP_HOST_PORT:-3000}:3000"
    volumes:
      - uploads_data:${UPLOAD_DIR:-/data/uploads}
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    init: true
    restart: unless-stopped
    stop_grace_period: 30s
    security_opt:
      - no-new-privileges:true

  worker:
    image: ghcr.io/haina2410/shoe-web/worker:${RELEASE_TAG:-latest}
    pull_policy: missing
    environment:
      <<: *runtime-environment
    depends_on:
      postgres:
        condition: service_healthy
    init: true
    restart: unless-stopped
    stop_grace_period: 30s
    security_opt:
      - no-new-privileges:true

  smoke:
    image: ghcr.io/haina2410/shoe-web/smoke:${RELEASE_TAG:-latest}
    pull_policy: missing
    environment:
      SMOKE_BASE_URL: ${SMOKE_BASE_URL:?required}
      SMOKE_PRODUCT_PATH: ${SMOKE_PRODUCT_PATH:?required}
    depends_on:
      app:
        condition: service_healthy
    profiles: ["ops"]

volumes:
  postgres_data:
  uploads_data:
