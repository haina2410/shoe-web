name: ${COMPOSE_PROJECT_NAME:-leafshoes}

# Không service nào ở đây có `build:`, và đó là cố ý: Compose có cả `build:` lẫn
# `image:` mà không khai `pull_policy` thì pull hụt sẽ âm thầm build từ source,
# biến một release pull lỗi thành bản build khác. Build tại chỗ đi qua
# docker-compose.build.yml, tường minh.

x-runtime-environment: &runtime-environment
  DATABASE_URL: postgresql://${POSTGRES_USER:?required}:${POSTGRES_PASSWORD:?required}@postgres:5432/${POSTGRES_DB:?required}?schema=public
  APP_BASE_URL: ${APP_BASE_URL:?required}
  VIETQR_BANK_CODE: ${VIETQR_BANK_CODE:?required}
  VIETQR_ACCOUNT_NO: ${VIETQR_ACCOUNT_NO:?required}
  VIETQR_ACCOUNT_NAME: ${VIETQR_ACCOUNT_NAME:?required}
  VIETQR_TEMPLATE: ${VIETQR_TEMPLATE:-compact2}
  RESEND_API_KEY: ${RESEND_API_KEY:?required}
  MAIL_FROM: ${MAIL_FROM:?required}
  MAIL_REPLY_TO: ${MAIL_REPLY_TO:?required}
  MAIL_TO_OVERRIDE: ${MAIL_TO_OVERRIDE:-}

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?required}
      POSTGRES_USER: ${POSTGRES_USER:?required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?required}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql/data

  migrate:
    image: ghcr.io/haina2410/shoe-web/migrate:${RELEASE_TAG:-latest}
    # `missing` để backup và lệnh chẩn đoán không cần chạm registry; deploy tự
    # ép pull bằng `--policy always`.
    pull_policy: missing
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:?required}:${POSTGRES_PASSWORD:?required}@postgres:5432/${POSTGRES_DB:?required}?schema=public
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?required}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:?required}
      SEED: ${SEED:-}
      SEED_OWNER_EMAIL: ${SEED_OWNER_EMAIL:-}
      SEED_OWNER_PASSWORD: ${SEED_OWNER_PASSWORD:-}
      SEED_STAFF_EMAIL: ${SEED_STAFF_EMAIL:-}
      SEED_STAFF_PASSWORD: ${SEED_STAFF_PASSWORD:-}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  app:
    image: ghcr.io/haina2410/shoe-web/app:${RELEASE_TAG:-latest}
    pull_policy: missing
    environment:
      <<: *runtime-environment
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?required}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:?required}
      SEPAY_WEBHOOK_SECRET: ${SEPAY_WEBHOOK_SECRET:?required}
      UPLOAD_DIR: ${UPLOAD_DIR:-/data/uploads}
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-5242880}
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:${APP_HOST_PORT:-3000}:3000"
    volumes:
      - uploads_data:${UPLOAD_DIR:-/data/uploads}
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    init: true
    restart: unless-stopped
    stop_grace_period: 30s
    security_opt:
      - no-new-privileges:true

  worker:
    image: ghcr.io/haina2410/shoe-web/worker:${RELEASE_TAG:-latest}
    pull_policy: missing
    environment:
      <<: *runtime-environment
      BOT_TOKEN: ${BOT_TOKEN:?required}
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    init: true
    restart: unless-stopped
    stop_grace_period: 30s
    security_opt:
      - no-new-privileges:true

  zalo-bot:
    image: ghcr.io/haina2410/shoe-web/worker:${RELEASE_TAG:-latest}
    pull_policy: missing
    command: npm run zalo-bot
    environment:
      BOT_TOKEN: ${BOT_TOKEN:?required}
    init: true
    restart: unless-stopped
    profiles: ["zalo-bot"]

  smoke:
    image: ghcr.io/haina2410/shoe-web/smoke:${RELEASE_TAG:-latest}
    pull_policy: missing
    environment:
      SMOKE_BASE_URL: ${SMOKE_BASE_URL:?required}
      SMOKE_PRODUCT_PATH: ${SMOKE_PRODUCT_PATH:?required}
    depends_on:
      app:
        condition: service_healthy
    profiles: ["ops"]

  dashboard:
    image: ghcr.io/haina2410/shoe-web/dashboard:${RELEASE_TAG:-latest}
    pull_policy: missing
    environment:
      # Không thêm `?schema=`: dashboard dùng node-postgres, không phải Prisma.
      DATABASE_URL: postgresql://${POSTGRES_USER:?required}:${POSTGRES_PASSWORD:?required}@postgres:5432/${POSTGRES_DB:?required}
      PGBOSS_SCHEMA: ${PGBOSS_SCHEMA:-pgboss}
      # Bỏ trống cặp này là dashboard chạy KHÔNG xác thực, mà nó retry và xoá
      # được job — nên đây là `:?required`, không phải giá trị mặc định.
      PGBOSS_DASHBOARD_AUTH_USERNAME: ${DASHBOARD_AUTH_USERNAME:?required}
      PGBOSS_DASHBOARD_AUTH_PASSWORD: ${DASHBOARD_AUTH_PASSWORD:?required}
    depends_on:
      postgres:
        condition: service_healthy
    # Loopback, và KHÔNG phải 3000: `app` đang giữ host port đó.
    ports:
      - "127.0.0.1:${DASHBOARD_HOST_PORT:-3010}:3000"
    init: true
    restart: "no"
    security_opt:
      - no-new-privileges:true
    profiles: ["ops"]

volumes:
  postgres_data:
  uploads_data:
