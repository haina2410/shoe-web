name: Deploy production

on:
  release:
    types: [published]

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy_production:
    name: Redeploy production with Komodo
    if: github.event.release.prerelease == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name }}
      KOMODO_PRODUCTION_WEBHOOK_URL: ${{ vars.KOMODO_PRODUCTION_WEBHOOK_URL }}
      KOMODO_WEBHOOK_SECRET: ${{ secrets.KOMODO_WEBHOOK_SECRET }}
    steps:
      - name: Trigger production deployment
        run: |
          payload="$(
            jq -cn \
              --arg ref "refs/heads/main" \
              --arg release_tag "$RELEASE_TAG" \
              '{ref: $ref, release_tag: $release_tag}'
          )"
          signature="$(
            printf '%s' "$payload" |
              openssl dgst -sha256 -hmac "$KOMODO_WEBHOOK_SECRET" |
              awk '{ print $NF }'
          )"

          curl \
            --fail-with-body \
            --silent \
            --show-error \
            --request POST \
            --header "Content-Type: application/json" \
            --header "X-GitHub-Event: push" \
            --header "X-GitHub-Delivery: ${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --header "X-Hub-Signature-256: sha256=${signature}" \
            --data-binary "$payload" \
            "$KOMODO_PRODUCTION_WEBHOOK_URL"

      - name: Write deployment summary
        run: |
          echo "Production release tag: \`$RELEASE_TAG\`" >> "$GITHUB_STEP_SUMMARY"
