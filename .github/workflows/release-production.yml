name: Release production

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing image tag: latest or a 12-character commit hash"
        required: true
        default: latest
        type: string

concurrency:
  group: production-release
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  TARGETS: app worker migrate smoke dashboard

jobs:
  release:
    name: Promote and deploy
    environment: production
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      SOURCE_TAG: ${{ inputs.tag }}
      KOMODO_WEBHOOK_URL: ${{ vars.KOMODO_WEBHOOK_URL }}
      KOMODO_WEBHOOK_SECRET: ${{ secrets.KOMODO_WEBHOOK_SECRET }}
    steps:
      - name: Validate source tag
        run: |
          if [[ "$SOURCE_TAG" != "latest" && ! "$SOURCE_TAG" =~ ^[0-9a-f]{12}$ ]]; then
            echo "tag must be latest or a 12-character lowercase commit hash" >&2
            exit 1
          fi

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve source tag
        run: |
          resolved_tag="$SOURCE_TAG"
          if [[ "$SOURCE_TAG" == "latest" ]]; then
            repository="${GITHUB_REPOSITORY,,}"
            revision="$(
              docker buildx imagetools inspect \
                "$REGISTRY/$repository/app:latest" \
                --format '{{json .Image}}' |
                jq -r '.config.Labels["org.opencontainers.image.revision"]'
            )"
            if [[ ! "$revision" =~ ^[0-9a-f]{40}$ ]]; then
              echo "app:latest does not contain a valid OCI revision label" >&2
              exit 1
            fi
            resolved_tag="${revision:0:12}"
          fi
          echo "RESOLVED_TAG=$resolved_tag" >> "$GITHUB_ENV"

      - name: Verify source images
        run: |
          repository="${GITHUB_REPOSITORY,,}"
          for target in $TARGETS; do
            docker buildx imagetools inspect \
              "$REGISTRY/$repository/$target:$RESOLVED_TAG"
          done

      - name: Promote images
        run: |
          repository="${GITHUB_REPOSITORY,,}"
          for target in $TARGETS; do
            image="$REGISTRY/$repository/$target"
            docker buildx imagetools create \
              --tag "$image:production" \
              "$image:$RESOLVED_TAG"
          done

      - name: Trigger production deployment
        run: |
          payload="$(
            jq -cn \
              --arg ref "refs/heads/main" \
              --arg source_tag "$RESOLVED_TAG" \
              '{ref: $ref, source_tag: $source_tag}'
          )"
          signature="$(
            printf '%s' "$payload" |
              openssl dgst -sha256 -hmac "$KOMODO_WEBHOOK_SECRET" |
              awk '{ print $NF }'
          )"

          curl \
            --fail-with-body \
            --silent \
            --show-error \
            --request POST \
            --header "Content-Type: application/json" \
            --header "X-GitHub-Event: push" \
            --header "X-GitHub-Delivery: ${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --header "X-Hub-Signature-256: sha256=${signature}" \
            --data-binary "$payload" \
            "$KOMODO_WEBHOOK_URL"

      - name: Write release summary
        run: |
          {
            echo "### Production release"
            echo ""
            echo "Requested tag: \`$SOURCE_TAG\`"
            echo "Resolved tag: \`$RESOLVED_TAG\`"
            echo "Production tag: \`production\`"
          } >> "$GITHUB_STEP_SUMMARY"
