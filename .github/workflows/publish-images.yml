# Tên package phải bắt đầu bằng tên repo: GHCR chỉ tự liên kết package với repo
# theo đường dẫn đó, nhờ vậy `secrets.GITHUB_TOKEN` push được, không cần PAT.
name: Publish images

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: publish-images-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  # Thêm arm64 vào đây là gấp đôi thời gian build: `npm run build` chạy lại dưới
  # QEMU.
  PLATFORMS: linux/amd64

jobs:
  publish:
    name: ${{ matrix.target }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        target: [app, worker, migrate, smoke, dashboard]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Xác định tên image và release tag
        id: names
        run: |
          # Hạ chữ vì GITHUB_REPOSITORY cho phép chữ hoa, tên image thì không.
          echo "image=${REGISTRY}/${GITHUB_REPOSITORY,,}/${{ matrix.target }}" >> "$GITHUB_OUTPUT"
          # Phải khớp RELEASE_TAG của scripts/deploy-production.sh, nếu không
          # deploy sẽ pull một tag không tồn tại.
          echo "release_tag=$GITHUB_SHA" >> "$GITHUB_OUTPUT"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Đăng nhập ghcr.io
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Sinh tag và label
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.names.outputs.image }}
          tags: |
            type=raw,value=${{ steps.names.outputs.release_tag }}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build và push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          target: ${{ matrix.target }}
          platforms: ${{ env.PLATFORMS }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Đọc thêm scope của `app`: cache của nó đã chứa layer `deps` và
          # `generated` mà ba target kia cần, khỏi `npm ci` lại từ đầu.
          cache-from: |
            type=gha,scope=${{ matrix.target }}
            type=gha,scope=app
          cache-to: type=gha,scope=${{ matrix.target }},mode=max

      - name: Ghi image đã publish vào summary
        if: github.event_name != 'pull_request'
        run: |
          {
            echo "### ${{ matrix.target }}"
            echo ""
            echo '```'
            echo "${{ steps.names.outputs.image }}@${{ steps.build.outputs.digest }}"
            echo '```'
            echo ""
            echo "Tag: \`${{ steps.names.outputs.release_tag }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  deploy_staging:
    name: Redeploy staging with Komodo
    needs: publish
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      KOMODO_STAGING_WEBHOOK_URL: ${{ vars.KOMODO_STAGING_WEBHOOK_URL }}
      KOMODO_WEBHOOK_SECRET: ${{ secrets.KOMODO_WEBHOOK_SECRET }}
    steps:
      - name: Trigger staging deployment
        run: |
          signature="$(
            openssl dgst \
              -sha256 \
              -hmac "$KOMODO_WEBHOOK_SECRET" \
              "$GITHUB_EVENT_PATH" |
              awk '{ print $NF }'
          )"

          curl \
            --fail-with-body \
            --silent \
            --show-error \
            --request POST \
            --header "Content-Type: application/json" \
            --header "X-GitHub-Event: ${GITHUB_EVENT_NAME}" \
            --header "X-GitHub-Delivery: ${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --header "X-Hub-Signature-256: sha256=${signature}" \
            --data-binary "@${GITHUB_EVENT_PATH}" \
            "$KOMODO_STAGING_WEBHOOK_URL"
