# Build bốn image của Dockerfile và push lên GitHub Container Registry.
#
# Mỗi target trong Dockerfile thành một package riêng dưới đường dẫn của repo:
#   ghcr.io/<owner>/<repo>/app      (Next.js standalone server)
#   ghcr.io/<owner>/<repo>/worker   (pg-boss worker)
#   ghcr.io/<owner>/<repo>/migrate  (prisma migrate deploy, one-shot)
#   ghcr.io/<owner>/<repo>/smoke    (Playwright smoke, chạy sau deploy)
#
# Tên package bắt đầu bằng tên repo là có chủ đích: GHCR tự liên kết package
# với repo đó, nên `secrets.GITHUB_TOKEN` push được mà không cần tạo PAT.
name: Publish images

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# Push liên tiếp lên cùng một ref thì chỉ release cái mới nhất là có ý nghĩa.
concurrency:
  group: publish-images-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  # Chỉ amd64 vì production server là amd64; thêm arm64 vào đây sẽ gấp đôi thời
  # gian build (`npm run build` chạy lại dưới QEMU) nên chỉ thêm khi thật cần.
  PLATFORMS: linux/amd64

jobs:
  publish:
    name: ${{ matrix.target }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      # Không fail-fast: khi một target vỡ, vẫn muốn biết ba target còn lại có
      # vỡ theo hay không thay vì phải chạy lại workflow để biết.
      fail-fast: false
      matrix:
        target: [app, worker, migrate, smoke]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Xác định tên image và release tag
        id: names
        run: |
          # GITHUB_REPOSITORY có thể chứa chữ hoa, nhưng tên image Docker thì
          # không được, nên hạ chữ trước khi ghép.
          echo "image=${REGISTRY}/${GITHUB_REPOSITORY,,}/${{ matrix.target }}" >> "$GITHUB_OUTPUT"
          # Cùng dạng tag với RELEASE_TAG mà scripts/deploy-production.sh dùng
          # (`git rev-parse --short=12 HEAD`), để một release chỉ có một tên.
          echo "release_tag=$(git rev-parse --short=12 HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      # Pull request chỉ build để chặn Dockerfile vỡ trước khi merge, không
      # push, nên cũng không cần đăng nhập registry.
      - name: Đăng nhập ghcr.io
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Sinh tag và label
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.names.outputs.image }}
          tags: |
            type=raw,value=${{ steps.names.outputs.release_tag }}
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build và push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          target: ${{ matrix.target }}
          platforms: ${{ env.PLATFORMS }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Đọc thêm cache của `app` vì app là target build đủ nhất: nó chứa
          # sẵn layer `deps` và `generated` mà worker/migrate/smoke cần.
          cache-from: |
            type=gha,scope=${{ matrix.target }}
            type=gha,scope=app
          cache-to: type=gha,scope=${{ matrix.target }},mode=max

      - name: Ghi image đã publish vào summary
        if: github.event_name != 'pull_request'
        run: |
          {
            echo "### ${{ matrix.target }}"
            echo ""
            echo '```'
            echo "${{ steps.names.outputs.image }}@${{ steps.build.outputs.digest }}"
            echo '```'
            echo ""
            echo "Tag: \`${{ steps.names.outputs.release_tag }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
