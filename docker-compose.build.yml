# Đường thoát khi registry không tới được: `BUILD_LOCALLY=1 npm run
# deploy:production`. Image vẫn mang tên ghcr.io, chiếm chỗ bản đáng lẽ pull về.
services:
  migrate:
    build:
      context: .
      target: migrate
    pull_policy: build

  app:
    build:
      context: .
      target: app
    pull_policy: build

  worker:
    build:
      context: .
      target: worker
    pull_policy: build

  smoke:
    build:
      context: .
      target: smoke
    pull_policy: build
