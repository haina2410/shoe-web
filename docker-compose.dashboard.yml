# Dashboard pg-boss (`@pg-boss/dashboard`), dùng để xem và retry job.
#
#   docker compose -f docker-compose.prod.yml -f docker-compose.dashboard.yml \
#     --profile ops up -d dashboard
#
# Nằm ở file riêng chứ không nằm trong file prod vì credential ở đây là bắt
# buộc: `:?required` trong một service có profile vẫn làm vỡ MỌI lệnh compose
# khác (kể cả `ps`, `logs`, deploy), kể cả khi profile đó chưa bật.
services:
  dashboard:
    image: ghcr.io/haina2410/shoe-web/dashboard:${RELEASE_TAG:-latest}
    pull_policy: missing
    environment:
      # Không thêm `?schema=`: dashboard dùng node-postgres, không phải Prisma.
      # Schema của pg-boss khai riêng bằng PGBOSS_SCHEMA.
      DATABASE_URL: postgresql://${POSTGRES_USER:?required}:${POSTGRES_PASSWORD:?required}@postgres:5432/${POSTGRES_DB:?required}
      PGBOSS_SCHEMA: ${PGBOSS_SCHEMA:-pgboss}
      # Bỏ trống cặp này là dashboard chạy KHÔNG xác thực, mà nó retry và xoá
      # được job. Đặt cả hai hoặc không dựng nó lên.
      PGBOSS_DASHBOARD_AUTH_USERNAME: ${DASHBOARD_AUTH_USERNAME:?required}
      PGBOSS_DASHBOARD_AUTH_PASSWORD: ${DASHBOARD_AUTH_PASSWORD:?required}
    depends_on:
      postgres:
        condition: service_healthy
    # Loopback, và KHÔNG phải 3000: `app` đang giữ host port đó.
    ports:
      - "127.0.0.1:${DASHBOARD_HOST_PORT:-3010}:3000"
    init: true
    restart: "no"
    security_opt:
      - no-new-privileges:true
    profiles: ["ops"]
